<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zenthos Gym">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4BE595"/>
      <stop offset="1" stop-color="#25B96B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="#0A0A0B"/>

  <!-- The Z is drawn as a lifted bar: the two horizontals are the knurled grip,
       the diagonal is the load between them. -->
  <path
    d="M148 128 H364 a8 8 0 0 1 8 8 v46 a12 12 0 0 1-3 8 L246 330 H364 a8 8 0 0 1 8 8 v46 a8 8 0 0 1-8 8 H148 a8 8 0 0 1-8-8 v-46 a12 12 0 0 1 3-8 L266 182 H148 a8 8 0 0 1-8-8 v-46 a8 8 0 0 1 8-8 Z"
    fill="url(#plate)"/>

  <!-- Plates on the ends of the bottom bar -->
  <rect x="100" y="330" width="26" height="62" rx="10" fill="#F6F6F3"/>
  <rect x="386" y="330" width="26" height="62" rx="10" fill="#F6F6F3"/>
  <rect x="100" y="120" width="26" height="62" rx="10" fill="#F6F6F3"/>
  <rect x="386" y="120" width="26" height="62" rx="10" fill="#F6F6F3"/>
</svg>
